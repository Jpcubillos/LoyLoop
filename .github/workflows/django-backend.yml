name: Django backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_http.py
      - run: python scripts/check_deploy.py
      - run: python scripts/check_client_secrets.py
      - name: Check local migration consistency
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check

  postgres:
    needs: [mobile-auth]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ll235-only
          POSTGRES_DB: loyloop_ll235
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      LL235_ISOLATED_DATABASE: 'yes'
      DB_PORT: '5432'
      DB_PASSWORD: isolated-ll235-only
    steps:
      - uses: actions/checkout@v4
      - name: Require mobile authentication checks
        run: test "${{ needs.mobile-auth.result }}" = "success"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/test_postgres.py
      - run: python scripts/test_api.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Django image
        run: docker build --tag loyloop-django:ci backend
      - name: Verify image runtime and absence of local secrets
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m
          loyloop-django:ci python -c
          "import os,pathlib; assert os.getuid()==10001; p=pathlib.Path('/app'); assert not list(p.rglob('.env*')); assert not list(p.rglob('*.crt')); assert not list(p.rglob('*.sqlite3'))"
      - name: Test in Linux container
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m
          loyloop-django:ci python -m unittest discover -s tests -v

  monitoring-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate alert rules and detection/recovery scenarios
        run: >-
          docker run --rm --network none --entrypoint /bin/promtool
          --volume "$PWD/backend/docker/observability:/rules:ro"
          --workdir /rules
          prom/prometheus:v3.16.0@sha256:89c1a644817e9ad70fa2af76c84898e327c1de7063735f962e8313b1e28672c3
          test rules alerts.test.yaml

  mobile-auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://test.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: mocked-public-test-key
      EXPO_PUBLIC_LOYLOOP_API_URL: https://api.example.test
      EXPO_PUBLIC_DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Auth UI contract (mocked provider and Django)
        run: |
          npx expo start --web --port 8091 > /tmp/loyloop-expo.log 2>&1 &
          node scripts/auth-mobile-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ll11-auth-ui
          path: mobile/.design-reference/qa/ll11
