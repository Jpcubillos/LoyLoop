route:
  receiver: local-audit
  group_by: [alertname]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h
receivers:
  - name: local-audit
    webhook_configs:
      - url: http://alert-receiver:9099/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/metrics_token
